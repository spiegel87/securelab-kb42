<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЛР 03 — сеанс</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 1.5rem auto; padding: 0 1rem; }
    fieldset { margin: 1rem 0; }
    label { display: block; margin: 0.4rem 0; }
    input, select, textarea { width: 100%; box-sizing: border-box; }
    button { margin-right: 0.5rem; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Навчальний сеанс</h1>
  <p>Стан: <strong id="session-state" role="status">Перевірка…</strong></p>
  <dl id="profile"></dl>

  <fieldset>
    <legend>Реєстрація</legend>
    <form id="register-form">
      <label>Ім’я користувача <input name="userName" autocomplete="username" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Відображуване ім’я <input name="displayName" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
      <button>Зареєструватися</button>
    </form>
  </fieldset>

  <fieldset>
    <legend>Вхід</legend>
    <form id="login-form">
      <label>Ім’я <input name="userName" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Увійти</button>
    </form>
    <p><button id="me" type="button">Мій профіль</button><button id="logout" type="button">Вийти</button></p>
  </fieldset>

  <fieldset>
    <legend>Новий інцидент</legend>
    <form id="incident-form">
      <label>Заголовок <input name="title" required></label>
      <label>Опис <textarea name="description" rows="3" required></textarea></label>
      <label>Severity
        <select name="severity">
          <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
        </select>
      </label>
      <label>Коли сталося <input name="occurredAtUtc" type="datetime-local" required></label>
      <button>Створити інцидент</button>
    </form>
  </fieldset>

  <pre id="output" role="status"></pre>
  <script src="auth-lab.js" defer></script>
</body>
</html>
